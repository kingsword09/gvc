name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  id-token: write

jobs:
  build-release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: gvc
            asset_name: gvc-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: gvc
            asset_name: gvc-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: gvc
            asset_name: gvc-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: gvc
            asset_name: gvc-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: gvc.exe
            asset_name: gvc-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        shell: bash

      - name: Strip binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Rename binary
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} release/${{ matrix.asset_name }}
        shell: bash

      - name: Generate checksum
        run: |
          cd release
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          fi
        shell: bash

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            release/${{ matrix.asset_name }}
            release/${{ matrix.asset_name }}.sha256
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs:
      - build-release
      - publish-crate
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather release assets
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
          overwrite_files: true

  publish-crate:
    name: Publish to crates.io
    needs: build-release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Read crate metadata
        id: crate
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1)
          echo "name=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["name"])' <<< "$metadata")" >> "$GITHUB_OUTPUT"
          echo "version=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])' <<< "$metadata")" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Check crates.io version
        id: crate_status
        run: |
          url="https://crates.io/api/v1/crates/${{ steps.crate.outputs.name }}/${{ steps.crate.outputs.version }}"
          status=$(curl -sS -o /tmp/crate-version.json -w "%{http_code}" \
            -H "User-Agent: kingsword09/gvc release workflow" \
            "$url")

          if [ "$status" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/crate-version.json
            echo "Unexpected crates.io response: $status" >&2
            exit 1
          fi
        shell: bash

      - name: Authenticate with crates.io
        if: steps.crate_status.outputs.exists == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        if: steps.crate_status.outputs.exists == 'false'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Skip existing crate version
        if: steps.crate_status.outputs.exists == 'true'
        run: echo "gvc ${{ steps.crate.outputs.version }} already exists on crates.io; skipping cargo publish."
